# Pubblica il sito su GitHub Pages a ogni push su main.
# Il sito è statico: nessuna build, si caricano i file così come sono (node_modules e cache esclusi dal repo).
name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Attiva GitHub Pages (la prima volta)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Niente Jekyll
        run: touch .nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
